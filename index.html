.period-tabs{display:flex;gap:0;border:1px solid #d2d2d7;border-radius:8px;overflow:hidden}
.period-tab{padding:8px 16px;font-size:13px;border:none;background:#fff;color:#555;cursor:pointer;border-right:1px solid #d2d2d7;transition:all .15s}
.period-tab:last-child{border-right:none}
.period-tab:hover{background:#f5f5f7}

.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.summary-item{flex:1;min-width:120px;background:#f5f5f7;border-radius:10px;padding:16px 20px}
.summary-item .num{font-size:26px;font-weight:600}
.summary-item .lbl{font-size:13px;color:#86868b;margin-top:2px}
.summary-item .change{font-size:12px;margin-top:2px}
.change-up{color:#34c759}
.change-down{color:#ff3b30}
.change-flat{color:#86868b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.grid-v{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-full{grid-column:1/-1}
.card{background:#f5f5f7;border-radius:12px;padding:24px}
.card.plain{background:#fff;border:1px solid #e8e8ed}
.card h3{font-size:13px;font-weight:600;color:#86868b;margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}
.chart-box{position:relative;height:250px;width:100%}
.chart-box-sm{position:relative;height:200px;width:100%}
.section{margin-bottom:22px}

.section p,.section li{font-size:15px;color:#1d1d1f;line-height:1.7}
.section ul{padding-left:18px}
.section ul li{margin-bottom:3px}
.tag{display:inline-block;background:#f0f0f0;padding:2px 10px;border-radius:10px;font-size:12px;color:#555;margin:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid #e8e8ed;color:#86868b;font-weight:500;font-size:13px}
td{padding:12px;border-bottom:1px solid #f0f0f0;vertical-align:top;color:#1d1d1f;font-size:14px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}
.badge-video{background:#e8f0fe;color:#1a56db}
.badge-image{background:#e6f4ea;color:#1e7e34}
.badge-carousel{background:#fef7e0;color:#e37400}
.ov-card{background:#f5f5f7;border-radius:12px;padding:20px;text-align:center}
.ov-card .ov-num{font-size:32px;font-weight:600}
.ov-card .ov-lbl{font-size:12px;color:#86868b;margin-top:2px}
.ov-card .ov-game{font-size:11px;color:#86868b;margin-top:6px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

.footer{text-align:center;padding:24px 0;color:#86868b;font-size:12px}
.error-box{display:none;text-align:center;padding:60px 24px;color:#86868b}

.error-box .err-text{font-size:16px;color:#1d1d1f;margin-bottom:8px}
.error-box .err-sub{font-size:13px}
@media(max-width:700px){.container{padding:24px 16px}.grid,.grid-3,.grid-v{grid-template-columns:1fr}.summary{flex-direction:column}}

const GAME_ORDER = ["Last_War","Monopoly_Go","Whiteout_Survival","Royal_Match"];

let charts = {};
let currentKey = 'overview';
let period = '7d';

function getSnapshotsInPeriod(gameKey) {
  const dates = SNAPSHOT_DATES;
  if (period === '7d') return [dates[dates.length-1]];
  if (period === '30d') return dates.slice(-2);
  return dates;
}

function getCurData(gameKey, snapDate) {
  return ALL_DATA[gameKey].snapshots[snapDate];
}

function getLatest(gameKey) {
  return ALL_DATA[gameKey].snapshots[SNAPSHOT_DATES[SNAPSHOT_DATES.length-1]];
}

function pctChange(gameKey, field) {
  const dates = getSnapshotsInPeriod(gameKey);
  if (dates.length < 2) return null;
  const first = ALL_DATA[gameKey].snapshots[dates[0]][field];
  const last = ALL_DATA[gameKey].snapshots[dates[dates.length-1]][field];
  if (first === 0) return null;
  return ((last - first) / first * 100).toFixed(1);
}

function renderSelect() {
  const sel = document.getElementById('gameSelect');
  let html = '<option value="overview">📊 整体局势</option>';
  GAME_ORDER.forEach(k => {
    html += '<option value="' + k + '"' + (k === currentKey ? ' selected' : '') + '>' + ALL_DATA[k].name + '</option>';
  });
  sel.innerHTML = html;
}

function renderPeriodTabs() {
  const el = document.getElementById('periodTabs');
  el.innerHTML = Object.entries(PERIOD_LABELS).map(([k,v]) =>
    '<button class="period-tab' + (k === period ? ' active' : '') + '" onclick="setPeriod(\'' + k + '\')">' + v + '</button>'
  ).join('');
}

function setPeriod(p) {
  period = p;
  renderPeriodTabs();
  if (currentKey !== 'overview') renderGame();
}

function onGameChange() {
  currentKey = document.getElementById('gameSelect').value;
  document.getElementById('periodGroup').style.display = currentKey === 'overview' ? 'none' : 'block';
  if (currentKey === 'overview') renderOverview();
  else renderGame();
}

function render() {
  try {
    renderSelect();
    renderPeriodTabs();
    document.getElementById('periodGroup').style.display = 'none';
    renderOverview();
  } catch (e) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('content').innerHTML = '';
    document.getElementById('summaryRow').innerHTML = '';
    console.error('render error:', e);
  }
}

  html += '<table><thead><tr><th>指标</th>' + GAME_ORDER.map(k => '<th>' + ALL_DATA[k].name + '</th>').join('') + '</tr></thead><tbody>';
  html += '<tr><td style="font-weight:500">广告总量</td>' + GAME_ORDER.map(k => '<td>' + getLatest(k).total + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">视频占比</td>' + GAME_ORDER.map(k => '<td>' + (getLatest(k).adType.video / (getLatest(k).adType.video+getLatest(k).adType.image+getLatest(k).adType.carousel+getLatest(k).adType.text)*100).toFixed(0) + '%</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">主要平台</td>' + GAME_ORDER.map(k => '<td>Facebook/' + Object.keys(getLatest(k).platform)[1] + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">核心受众</td>' + GAME_ORDER.map(k => '<td style="font-size:13px">' + ALL_DATA[k].audience + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">预估年预算</td>' + GAME_ORDER.map(k => '<td>' + ALL_DATA[k].spend + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">核心策略</td>' + GAME_ORDER.map(k => '<td style="font-size:13px">' + getLatest(k).strategies[0][0] + '</td>').join('') + '</tr>';
  html += '</tbody></table>';
  html += '</div>';

  // Overall analysis
  html += '<div class="card plain grid-full" style="margin-top:20px">';
  html += '<h3>整体局势分析</h3>';
  const maxGame = GAME_ORDER.reduce((a,b) => getLatest(a).total > getLatest(b).total ? a : b);
  const minGame = GAME_ORDER.reduce((a,b) => getLatest(a).total < getLatest(b).total ? a : b);
  html += '<div class="section"><h4>投放规模</h4><p>' + ALL_DATA[maxGame].name + ' 投放量最大（' + getLatest(maxGame).total + '条），' + ALL_DATA[minGame].name + ' 最低（' + getLatest(minGame).total + '条）。四家合计年预估投放预算超过 $530M。</p></div>';
  html += '<div class="section"><h4>素材策略</h4><p>视频是绝对主力，各竞品视频占比在 64%-75% 之间。Royal Match 和 Monopoly Go! 的视频投入最高，与其大型买量策略一致。</p></div>';
  html += '<div class="section"><h4>竞争格局</h4><p>Monopoly Go! 和 Royal Match 属于第一梯队（年预算 $200M+），Last War 和 Whiteout Survival 属于第二梯队（年预算 $30-100M）。策略游戏赛道竞争相对分散，给了中小预算产品切入空间。</p></div>';
  html += '</div>';

  html += '<div class="footer">数据基于公开情报整理 · 部分数据为估算值</div>';

  document.getElementById('content').innerHTML = html;

  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  // Chart: total comparison
  charts.ov1 = new Chart(document.getElementById('ov1'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => getLatest(k).total), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false } } } }
  });

  // Chart: video ratio
  charts.ov2 = new Chart(document.getElementById('ov2'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => (getLatest(k).adType.video / (getLatest(k).adType.video+getLatest(k).adType.image+getLatest(k).adType.carousel+getLatest(k).adType.text)*100).toFixed(1)), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, max: 100, grid: { display: false }, ticks: { callback: v => v + '%' } } } }
  });

  // Chart: platform comparison
  charts.ov3 = new Chart(document.getElementById('ov3'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [
      { label: 'Facebook', data: GAME_ORDER.map(k => getLatest(k).platform.facebook), backgroundColor: '#1877f2' },
      { label: 'Instagram', data: GAME_ORDER.map(k => getLatest(k).platform.instagram), backgroundColor: '#e4405f' }
    ] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false } } } }
  });

  // Chart: budget
  const budgetMap = { "Last_War": 75, "Monopoly_Go": 325, "Whiteout_Survival": 45, "Royal_Match": 300 };
  charts.ov4 = new Chart(document.getElementById('ov4'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => budgetMap[k]), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false }, ticks: { callback: v => '$' + v + 'M' } } } }
  });
}

// ===== GAME DETAIL =====
function renderGame() {
  const gameKey = currentKey;
  const dates = getSnapshotsInPeriod(gameKey);
  const snap = ALL_DATA[gameKey].snapshots;
  const d = snap[dates[dates.length-1]];
  const ads = ADS_DATA[gameKey];
  const t = d.adType;
  const total = t.video + t.image + t.carousel + t.text;
  const vp = (t.video / total * 100).toFixed(0);
  const gameName = ALL_DATA[gameKey].name;
  const lastDate = SNAPSHOT_DATES[SNAPSHOT_DATES.length-1];
  const prevDate = SNAPSHOT_DATES.length > 1 ? SNAPSHOT_DATES[SNAPSHOT_DATES.length-2] : null;

  document.getElementById('updateInfo').textContent = '数据更新：' + lastDate + ' · ' + gameName + ' · 周期：' + PERIOD_LABELS[period];

  // Summary with trend
  let summaryHtml = '<div style="font-size:13px;color:#86868b;margin-bottom:8px;width:100%">数据更新：' + lastDate + '</div>';
  summaryHtml += '<div class="summary-item"><div class="num">' + d.total + '</div><div class="lbl">广告分析数</div>';
  if (prevDate && dates.length > 1) {
    const ch = pctChange(gameKey, 'total');
    if (ch) summaryHtml += '<div class="change ' + (ch > 0 ? 'change-up' : ch < 0 ? 'change-down' : 'change-flat') + '">' + (ch > 0 ? '↑' : '↓') + Math.abs(ch) + '%</div>';
  }
  summaryHtml += '</div>';

  summaryHtml += '<div class="summary-item"><div class="num">' + vp + '%</div><div class="lbl">视频占比</div></div>';
  summaryHtml += '<div class="summary-item"><div class="num">' + d.strategies.length + '</div><div class="lbl">策略类型</div></div>';
  summaryHtml += '<div class="summary-item"><div class="num">' + d.keywords.length + '</div><div class="lbl">关键词</div></div>';
  document.getElementById('summaryRow').innerHTML = summaryHtml;

  let html = '<div class="grid">' +
    '<div class="card"><h3>素材类型分布</h3><div class="chart-box"><canvas id="c1"></canvas></div></div>' +
    '<div class="card"><h3>关键词 Top 10</h3><div class="chart-box"><canvas id="c2"></canvas></div></div>' +
    '<div class="card"><h3>平台分布</h3><div class="chart-box"><canvas id="c3"></canvas></div></div>' +
    '<div class="card"><h3>情感诉求</h3><div class="chart-box"><canvas id="c4"></canvas></div></div>';

  // Trend chart (if multiple snapshots available)
  if (dates.length > 1) {
    html += '<div class="card grid-full"><h3>广告量趋势</h3><div class="chart-box"><canvas id="c5"></canvas></div></div>';
  }

  html += '</div>';

  // Report
  html += '<div class="card plain grid-full" style="margin-bottom:20px">' +
    '<div class="section"><h4>整体策略</h4><p>' + ALL_DATA[gameKey].focus + '</p></div>' +
    '<div class="section"><h4>素材分布</h4><p>视频 ' + vp + '%，图片 ' + (t.image/total*100).toFixed(0) + '%，轮播 ' + (t.carousel/total*100).toFixed(0) + '%</p></div>' +
    '<div class="section"><h4>高频关键词</h4><p>' + d.keywords.slice(0,6).map(k => '<span class="tag">' + k[0] + '</span>').join(' ') + '</p></div>' +
    '<div class="section"><h4>视觉元素</h4><p>' + d.visuals.slice(0,6).map(v => '<span class="tag">' + v + '</span>').join(' ') + '</p></div>' +
    '<div class="section"><h4>创意策略</h4><ul>' + d.strategies.map(s => '<li><strong>' + s[0] + '</strong> (' + s[1] + '%) — ' + s[2] + '</li>').join('') + '</ul></div>' +
    '<div class="section"><h4>投放策略</h4><p><strong>核心受众：</strong>' + ALL_DATA[gameKey].audience + '<br><strong>再营销：</strong>' + ALL_DATA[gameKey].retargeting + '</p></div>' +
    '<div class="section"><h4>竞争定位</h4><p>' + ALL_DATA[gameKey].position + '</p></div>' +
    '<div class="section"><h4>预估预算</h4><p>' + ALL_DATA[gameKey].spend + '</p></div>' +
  '</div>';

  // Ads
  html += '<div class="card plain grid-full">' +
    '<h3>值得关注的广告</h3>' +
    '<table><thead><tr><th style="width:60px">类型</th><th>文案摘要</th><th style="width:130px">策略</th><th>分析</th></tr></thead><tbody>' +
    ads.map(a => '<tr><td><span class="badge badge-' + a[0] + '">' + (a[0]==='video'?'视频':a[0]==='image'?'图片':'轮播') + '</span></td><td>' + a[1] + '</td><td style="color:#86868b;font-size:13px">' + a[2] + '</td><td style="color:#555;font-size:13px">' + a[3] + '</td></tr>').join('') +
    '</tbody></table>' +
  '</div>';

  html += '<div class="footer">数据基于公开情报整理</div>';

  document.getElementById('content').innerHTML = html;

  // Charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  charts.c1 = new Chart(document.getElementById('c1'), {
    type: 'pie',
    data: { labels: ['视频','图片','轮播','纯文字'], datasets: [{ data: [t.video,t.image,t.carousel,t.text], backgroundColor: ['#007aff','#34c759','#ff9500','#c7c7cc'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 16, font: { size: 12 } } } } }
  });
  charts.c2 = new Chart(document.getElementById('c2'), {
    type: 'bar',
    data: { labels: d.keywords.map(k => k[0]), datasets: [{ data: d.keywords.map(k => k[1]), backgroundColor: '#007aff', borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false }, ticks: { font: { size: 11 } } } } }
  });
  charts.c3 = new Chart(document.getElementById('c3'), {
    type: 'doughnut',
    data: { labels: Object.keys(d.platform), datasets: [{ data: Object.values(d.platform), backgroundColor: ['#1877f2','#e4405f','#34c759','#ff9500'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 } } } } }
  });
  const clrs = ['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#5ac8fa','#af52de'];
  charts.c4 = new Chart(document.getElementById('c4'), {
    type: 'bar',
    data: { labels: Object.keys(d.emotion), datasets: [{ data: Object.values(d.emotion), backgroundColor: clrs.slice(0, Object.keys(d.emotion).length), borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, max: 100, grid: { display: false }, ticks: { callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { font: { size: 11 } } } } }
  });

  // Trend chart
  if (dates.length > 1) {
    charts.c5 = new Chart(document.getElementById('c5'), {
      type: 'line',
      data: {
        labels: dates,
        datasets: [
          { label: '广告总量', data: dates.map(d => snap[d].total), borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,0.1)', fill: true, tension: 0.3, pointRadius: 4 },
          { label: '视频数', data: dates.map(d => snap[d].adType.video), borderColor: '#34c759', backgroundColor: 'rgba(52,199,89,0.1)', fill: true, tension: 0.3, pointRadius: 4 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { display: false } } } }
    });
  }
}

try { render(); } catch (e) {
  document.getElementById('errorBox').style.display = 'block';
  console.error('init render error:', e);
}
</script>
