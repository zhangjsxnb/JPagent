.change-flat{color:#86868b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.grid-v{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-full{grid-column:1/-1}
.card{background:#f5f5f7;border-radius:12px;padding:24px}

.tag{display:inline-block;background:#f0f0f0;padding:2px 10px;border-radius:10px;font-size:12px;color:#555;margin:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid #e8e8ed;color:#86868b;font-weight:500;font-size:13px}
td{padding:12px;border-bottom:1px solid #f0f0f0;vertical-align:top;color:#1d1d1f;font-size:14px}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}
.badge-video{background:#e8f0fe;color:#1a56db}
.badge-image{background:#e6f4ea;color:#1e7e34}
.badge-carousel{background:#fef7e0;color:#e37400}
.ov-card{background:#f5f5f7;border-radius:12px;padding:20px;text-align:center}

const GAME_ORDER = ["Last_War","Monopoly_Go","Whiteout_Survival","Royal_Match"];

let charts = {};
let currentKey = 'overview';
let period = '7d';

function getSnapshotsInPeriod(gameKey) {
  const dates = SNAPSHOT_DATES;
  if (period === '7d') return [dates[dates.length-1]];
  if (period === '30d') return dates.slice(-2);
  return dates;
}

function getCurData(gameKey, snapDate) {
  return ALL_DATA[gameKey].snapshots[snapDate];
}

function getLatest(gameKey) {
  return ALL_DATA[gameKey].snapshots[SNAPSHOT_DATES[SNAPSHOT_DATES.length-1]];
}

function pctChange(gameKey, field) {
  const dates = getSnapshotsInPeriod(gameKey);
  if (dates.length < 2) return null;
  const first = ALL_DATA[gameKey].snapshots[dates[0]][field];
  const last = ALL_DATA[gameKey].snapshots[dates[dates.length-1]][field];
  if (first === 0) return null;
  return ((last - first) / first * 100).toFixed(1);
}

function renderSelect() {
  const sel = document.getElementById('gameSelect');
  let html = '<option value="overview">📊 整体局势</option>';
  GAME_ORDER.forEach(k => {
    html += '<option value="' + k + '"' + (k === currentKey ? ' selected' : '') + '>' + ALL_DATA[k].name + '</option>';
  });
  sel.innerHTML = html;
}

function renderPeriodTabs() {
  const el = document.getElementById('periodTabs');
  el.innerHTML = Object.entries(PERIOD_LABELS).map(([k,v]) =>
    '<button class="period-tab' + (k === period ? ' active' : '') + '" onclick="setPeriod(\'' + k + '\')">' + v + '</button>'
  ).join('');
}

function setPeriod(p) {
  period = p;
  renderPeriodTabs();
  if (currentKey !== 'overview') renderGame();
}

function onGameChange() {
  currentKey = document.getElementById('gameSelect').value;
  document.getElementById('periodGroup').style.display = currentKey === 'overview' ? 'none' : 'block';
  if (currentKey === 'overview') renderOverview();
  else renderGame();
}

function render() {
  try {
    renderSelect();
    renderPeriodTabs();
    document.getElementById('periodGroup').style.display = 'none';
    renderOverview();
  } catch (e) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('content').innerHTML = '';
    document.getElementById('summaryRow').innerHTML = '';
    console.error('render error:', e);
  }
}

// ===== OVERVIEW =====

  document.getElementById('gameSelect').value = 'overview';

  html += '<div class="grid">' +
    '<div class="card"><h3>广告总量对比</h3><div class="chart-box"><canvas id="ov1"></canvas></div></div>' +
    '<div class="card"><h3>视频占比对比</h3><div class="chart-box"><canvas id="ov2"></canvas></div></div>' +
    '<div class="card"><h3>平台分布对比</h3><div class="chart-box"><canvas id="ov3"></canvas></div></div>' +
    '<div class="card"><h3>预估年预算</h3><div class="chart-box"><canvas id="ov4"></canvas></div></div>' +
  '</div>';

  // Comparison table
  html += '<div class="card plain grid-full">';
  html += '<h3>竞品对比总览</h3>';
  html += '<table><thead><tr><th>指标</th>' + GAME_ORDER.map(k => '<th>' + ALL_DATA[k].name + '</th>').join('') + '</tr></thead><tbody>';
  html += '<tr><td style="font-weight:500">广告总量</td>' + GAME_ORDER.map(k => '<td>' + getLatest(k).total + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">视频占比</td>' + GAME_ORDER.map(k => '<td>' + (getLatest(k).adType.video / (getLatest(k).adType.video+getLatest(k).adType.image+getLatest(k).adType.carousel+getLatest(k).adType.text)*100).toFixed(0) + '%</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">主要平台</td>' + GAME_ORDER.map(k => '<td>Facebook/' + Object.keys(getLatest(k).platform)[1] + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">核心受众</td>' + GAME_ORDER.map(k => '<td style="font-size:13px">' + ALL_DATA[k].audience + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">预估年预算</td>' + GAME_ORDER.map(k => '<td>' + ALL_DATA[k].spend + '</td>').join('') + '</tr>';
  html += '<tr><td style="font-weight:500">核心策略</td>' + GAME_ORDER.map(k => '<td style="font-size:13px">' + getLatest(k).strategies[0][0] + '</td>').join('') + '</tr>';
  html += '</tbody></table>';
  html += '</div>';

  // Overall analysis
  html += '<div class="card plain grid-full" style="margin-top:20px">';
  html += '<h3>整体局势分析</h3>';
  const maxGame = GAME_ORDER.reduce((a,b) => getLatest(a).total > getLatest(b).total ? a : b);
  const minGame = GAME_ORDER.reduce((a,b) => getLatest(a).total < getLatest(b).total ? a : b);
  html += '<div class="section"><h4>投放规模</h4><p>' + ALL_DATA[maxGame].name + ' 投放量最大（' + getLatest(maxGame).total + '条），' + ALL_DATA[minGame].name + ' 最低（' + getLatest(minGame).total + '条）。四家合计年预估投放预算超过 $530M。</p></div>';
  html += '<div class="section"><h4>素材策略</h4><p>视频是绝对主力，各竞品视频占比在 64%-75% 之间。Royal Match 和 Monopoly Go! 的视频投入最高，与其大型买量策略一致。</p></div>';
  html += '<div class="section"><h4>竞争格局</h4><p>Monopoly Go! 和 Royal Match 属于第一梯队（年预算 $200M+），Last War 和 Whiteout Survival 属于第二梯队（年预算 $30-100M）。策略游戏赛道竞争相对分散，给了中小预算产品切入空间。</p></div>';
  html += '</div>';

  html += '<div class="footer">数据基于公开情报整理 · 部分数据为估算值</div>';

  document.getElementById('content').innerHTML = html;

  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  // Chart: total comparison
  charts.ov1 = new Chart(document.getElementById('ov1'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => getLatest(k).total), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false } } } }
  });

  // Chart: video ratio
  charts.ov2 = new Chart(document.getElementById('ov2'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => (getLatest(k).adType.video / (getLatest(k).adType.video+getLatest(k).adType.image+getLatest(k).adType.carousel+getLatest(k).adType.text)*100).toFixed(1)), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, max: 100, grid: { display: false }, ticks: { callback: v => v + '%' } } } }
  });

  // Chart: platform comparison
  charts.ov3 = new Chart(document.getElementById('ov3'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [
      { label: 'Facebook', data: GAME_ORDER.map(k => getLatest(k).platform.facebook), backgroundColor: '#1877f2' },
      { label: 'Instagram', data: GAME_ORDER.map(k => getLatest(k).platform.instagram), backgroundColor: '#e4405f' }
    ] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false } } } }
  });

  // Chart: budget
  const budgetMap = { "Last_War": 75, "Monopoly_Go": 325, "Whiteout_Survival": 45, "Royal_Match": 300 };
  charts.ov4 = new Chart(document.getElementById('ov4'), {
    type: 'bar',
    data: { labels: GAME_ORDER.map(k => ALL_DATA[k].name), datasets: [{ data: GAME_ORDER.map(k => budgetMap[k]), backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'], borderRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false }, ticks: { callback: v => '$' + v + 'M' } } } }
  });
}

// ===== GAME DETAIL =====
function renderGame() {
  const gameKey = currentKey;
  if (!gameKey || gameKey === 'overview') { renderOverview(); return; }
  const game = ALL_DATA[gameKey];
  if (!game) return;
  const dates = getSnapshotsInPeriod(gameKey);
  const latest = getLatest(gameKey);
  const latestDate = SNAPSHOT_DATES[SNAPSHOT_DATES.length-1];

  document.getElementById('gameSelect').value = gameKey;
  document.getElementById('updateInfo').textContent = '数据更新：' + latestDate + ' · ' + game.name + ' · 周期：' + PERIOD_LABELS[period];

  // Summary row
  const totalAdTypes = latest.adType.video + latest.adType.image + latest.adType.carousel + latest.adType.text;
  const videoPct = (latest.adType.video / totalAdTypes * 100).toFixed(0);
  const change = pctChange(gameKey, 'total');
  let changeHtml = '';
  if (change !== null) {
    const arrow = change >= 0 ? '↑' : '↓';
    const cls = change >= 0 ? 'change-up' : 'change-down';
    changeHtml = '<div class="change ' + cls + '">' + arrow + Math.abs(change) + '%</div>';
  }

  document.getElementById('summaryRow').innerHTML =
    '<div class="summary-item"><div class="num">' + latest.total + '</div><div class="lbl">广告总数</div>' + changeHtml + '</div>' +
    '<div class="summary-item"><div class="num">' + videoPct + '%</div><div class="lbl">视频占比</div></div>' +
    '<div class="summary-item"><div class="num">' + Object.keys(latest.platform).length + '</div><div class="lbl">投放平台</div></div>' +
    '<div class="summary-item"><div class="num">' + game.spend.split(' ')[0] + '</div><div class="lbl">预估年预算</div></div>';

  let html = '';

  // Charts grid
  html += '<div class="grid">';
  html += '<div class="card"><h3>素材类型分布</h3><div class="chart-box"><canvas id="gd1"></canvas></div></div>';
  html += '<div class="card"><h3>平台分布</h3><div class="chart-box"><canvas id="gd2"></canvas></div></div>';
  html += '<div class="card"><h3>情感诉求分析</h3><div class="chart-box"><canvas id="gd3"></canvas></div></div>';
  html += '<div class="card"><h3>高频关键词 Top 10</h3><div class="chart-box"><canvas id="gd4"></canvas></div></div>';
  html += '</div>';

  // Trend chart
  html += '<div class="card plain grid-full" style="margin-bottom:20px">';
  html += '<h3>广告量趋势</h3><div class="chart-box"><canvas id="gd5"></canvas></div>';
  html += '</div>';

  // Visual elements
  html += '<div class="card plain grid-full" style="margin-bottom:20px">';
  html += '<h3>高频视觉元素</h3>';
  html += '<div>' + (latest.visuals || []).map(v => '<span class="tag">' + v + '</span>').join('') + '</div>';
  html += '</div>';

  // Strategies table
  html += '<div class="card plain grid-full" style="margin-bottom:20px">';
  html += '<h3>创意策略</h3>';
  html += '<table><thead><tr><th>策略</th><th>占比</th><th>说明</th></tr></thead><tbody>';
  (latest.strategies || []).forEach(s => {
    html += '<tr><td style="font-weight:500">' + s[0] + '</td><td>' + s[1] + '%</td><td style="font-size:13px;color:#555">' + s[2] + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '</div>';

  // Audience & positioning
  html += '<div class="grid" style="margin-bottom:20px">';
  html += '<div class="card plain"><h3>目标受众</h3><p style="font-size:15px">' + game.audience + '</p></div>';
  html += '<div class="card plain"><h3>再营销策略</h3><p style="font-size:15px">' + game.retargeting + '</p></div>';
  html += '</div>';

  html += '<div class="card plain grid-full" style="margin-bottom:20px">';
  html += '<h3>竞争定位</h3><p style="font-size:15px">' + game.position + '</p>';
  html += '<p style="font-size:15px;margin-top:8px;color:#555">' + game.focus + '</p></div>';

  // Ad examples table
  html += '<div class="card plain grid-full">';
  html += '<h3>广告案例分析</h3>';
  html += '<table><thead><tr><th>类型</th><th>文案/描述</th><th>策略点</th><th>亮点</th></tr></thead><tbody>';
  if (ADS_DATA[gameKey]) {
    ADS_DATA[gameKey].forEach(ad => {
      const typeClass = ad[0] === 'video' ? 'video' : ad[0] === 'image' ? 'image' : 'carousel';
      html += '<tr><td><span class="badge badge-' + typeClass + '">' + ad[0] + '</span></td><td style="font-size:13px">' + ad[1] + '</td><td style="font-size:13px">' + ad[2] + '</td><td style="font-size:13px;color:#555">' + (ad[3] || '') + '</td></tr>';
    });
  }
  html += '</tbody></table>';
  html += '</div>';

  html += '<div class="footer">数据基于公开情报整理 · 部分数据为估算值</div>';

  document.getElementById('content').innerHTML = html;

  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  // Pie chart: ad type distribution
  charts.gd1 = new Chart(document.getElementById('gd1'), {
    type: 'pie',
    data: {
      labels: ['视频','图片','轮播','纯文字'],
      datasets: [{ data: [latest.adType.video, latest.adType.image, latest.adType.carousel, latest.adType.text], backgroundColor: ['#007aff','#ff9500','#34c759','#ff3b30'] }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } } }
  });

  // Bar chart: platform distribution
  const platKeys = Object.keys(latest.platform);
  const platColors = ['#1877f2','#e4405f','#00b4d8','#ff6b6b'];
  charts.gd2 = new Chart(document.getElementById('gd2'), {
    type: 'bar',
    data: {
      labels: platKeys.map(k => ({facebook:'Facebook',instagram:'Instagram',messenger:'Messenger',audience_network:'Audience Network'})[k] || k),
      datasets: [{ data: platKeys.map(k => latest.platform[k]), backgroundColor: platColors.slice(0, platKeys.length), borderRadius: 3 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { display: false } }, x: { ticks: { font: { size: 10 } } } } }
  });

  // Doughnut chart: emotional appeals
  const emoKeys = Object.keys(latest.emotion);
  const emoLabels = {
    urgency:'紧迫感', fomo:'FOMO', achievement:'成就感', curiosity:'好奇心',
    social:'社交', fear:'恐惧', hope:'希望', frustration:'挫败感',
    wealth:'财富', competition:'竞争', nostalgia:'怀旧', comfort:'舒适'
  };
  const emoColors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#1dd1a1','#e17055','#00cec9','#6c5ce7','#fd79a8','#fdcb6e'];
  charts.gd3 = new Chart(document.getElementById('gd3'), {
    type: 'doughnut',
    data: {
      labels: emoKeys.map(k => emoLabels[k] || k),
      datasets: [{ data: emoKeys.map(k => latest.emotion[k]), backgroundColor: emoColors.slice(0, emoKeys.length) }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } } }
  });

  // Bar chart: top keywords
  const kwData = (latest.keywords || []).slice(0, 10);
  charts.gd4 = new Chart(document.getElementById('gd4'), {
    type: 'bar',
    data: {
      labels: kwData.map(k => k[0]),
      datasets: [{ data: kwData.map(k => k[1]), backgroundColor: '#007aff', borderRadius: 3 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { beginAtZero: true, grid: { display: false } } } }
  });

  // Line chart: trend over snapshots
  const trendDates = SNAPSHOT_DATES;
  charts.gd5 = new Chart(document.getElementById('gd5'), {
    type: 'line',
    data: {
      labels: trendDates,
      datasets: [
        { label: '广告总数', data: trendDates.map(d => { const s = ALL_DATA[gameKey].snapshots[d]; return s ? s.total : 0; }), borderColor: '#007aff', backgroundColor: 'rgba(0,122,255,0.1)', fill: true, tension: 0.3, pointRadius: 4 },
        { label: '视频数', data: trendDates.map(d => { const s = ALL_DATA[gameKey].snapshots[d]; return s ? s.adType.video : 0; }), borderColor: '#34c759', backgroundColor: 'rgba(52,199,89,0.1)', fill: true, tension: 0.3, pointRadius: 4 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } }, scales: { y: { beginAtZero: true, grid: { display: true, color: '#f0f0f0' } }, x: { grid: { display: false } } } }
  });
}

// ===== INIT =====
try { render(); } catch(e) { document.getElementById('errorBox').style.display = 'block'; console.error(e); }
</script>
